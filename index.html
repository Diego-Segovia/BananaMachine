<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potassium Engine</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="icon" type="image/svg+xml"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/prescription2.svg">

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script defer src="index.js"></script>
</head>

<body class="bg-body-tertiary">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Patient Potassium Entry</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3 fw-bold">Past 3 Tx Baths</div>
                        <div class="mb-3">
                            <label for="dataInput" class="form-label">1st K+ Level</label>
                            <input type="number" step="0.1" class="form-control" id="1stK+Level"
                                placeholder="Enter value (e.g., 4.5)">
                        </div>
                        <div class="mb-3">
                            <label for="dataInput" class="form-label">2nd K+ Level</label>
                            <input type="number" step="0.1" class="form-control" id="2ndK+Level"
                                placeholder="Enter value (e.g., 4.5)">
                        </div>
                        <div class="mb-3">
                            <label for="dataInput" class="form-label">3rd K+ Level</label>
                            <input type="number" step="0.1" class="form-control" id="3rdK+Level"
                                placeholder="Enter value (e.g., 4.5)">
                        </div>
                        <hr class="border-secondary">
                        <div class="mb-3 fw-bold">Current Patient Potassium</div>
                        <div class="mb-3">
                            <label for="dataInput" class="form-label">K+ Level</label>
                            <input type="number" step="0.1" class="form-control" id="currentK+Level"
                                placeholder="Enter value (e.g., 4.5)">
                        </div>
                        <button type="button" id="actionBtn" class="btn btn-primary w-100">Process Algorithm</button>
                    </div>
                    <div class="card-footer text-center text-body-secondary" id="feedbackAreaPlaceholder">
                        Awaiting input...
                    </div>
                    <div class="card-footer text-center text-body-secondary d-none" id="feedbackArea">
                        Patient to dialyze on: <span class="fw-bold text-primary" id="bathAmountId">2.0 K+</span> bath.
                    </div>
                    <div class="card-footer text-center text-body-secondary d-none" id="dialysisFrequencyResult">
                        Patient can be removed from weekly po.
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
